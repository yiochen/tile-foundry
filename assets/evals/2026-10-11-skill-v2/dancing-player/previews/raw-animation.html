<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raw dancing source animation</title><style>body{font:16px system-ui;background:#f4f6ef;color:#18222e;margin:24px;max-width:700px}h1{font-size:24px}canvas{width:min(100%,512px);height:auto;display:block;border:1px solid #aaa}button{font:inherit;padding:8px 14px;margin:12px 0}</style><h1>Unprocessed dancing source</h1><p>12 fps playback of complete original source panels, aligned at each measured calibration floor center without resizing. The frozen processor rejected non-square floors. This is a diagnostic source preview, not a calibrated runtime sprite.</p><button id="pause">Pause</button><span id="label"></span><canvas width="512" height="768"></canvas><script>
const data=[{"src": "source-panels/frame-00.png", "anchor": [131.5, 377.0]}, {"src": "source-panels/frame-01.png", "anchor": [129.5, 377.0]}, {"src": "source-panels/frame-02.png", "anchor": [129.0, 377.0]}, {"src": "source-panels/frame-03.png", "anchor": [125.5, 377.0]}, {"src": "source-panels/frame-04.png", "anchor": [131.5, 388.5]}, {"src": "source-panels/frame-05.png", "anchor": [129.5, 388.5]}, {"src": "source-panels/frame-06.png", "anchor": [128.0, 389.0]}, {"src": "source-panels/frame-07.png", "anchor": [125.5, 388.5]}, {"src": "source-panels/frame-08.png", "anchor": [132.0, 366.0]}, {"src": "source-panels/frame-09.png", "anchor": [130.0, 366.5]}, {"src": "source-panels/frame-10.png", "anchor": [128.0, 367.0]}, {"src": "source-panels/frame-11.png", "anchor": [125.5, 365.5]}];const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),label=document.querySelector('#label'),pause=document.querySelector('#pause');let images=[],paused=false,start=performance.now(),held=0;const fixed=new URLSearchParams(location.search).get('frame');
Promise.all(data.map(d=>new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i);i.src=d.src}))).then(arr=>{images=arr;requestAnimationFrame(tick)});
function draw(index){ctx.fillStyle='#18222e';ctx.fillRect(0,0,512,768);const d=data[index],i=images[index];ctx.drawImage(i,256-d.anchor[0],560-d.anchor[1]);ctx.strokeStyle='#e73699';ctx.beginPath();ctx.moveTo(246,560);ctx.lineTo(266,560);ctx.moveTo(256,550);ctx.lineTo(256,570);ctx.stroke();label.textContent=' Frame '+String(index+1).padStart(2,'0')+' / 12';}
function tick(t){const index=fixed!==null?Number(fixed)%12:paused?held:Math.floor((t-start)*12/1000)%12;draw(index);requestAnimationFrame(tick)}pause.onclick=()=>{paused=!paused;if(paused){held=Math.floor((performance.now()-start)*12/1000)%12;pause.textContent='Play'}else{start=performance.now()-held*1000/12;pause.textContent='Pause'}};
</script></html>
