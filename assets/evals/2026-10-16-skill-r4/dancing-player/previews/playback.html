<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dancing player — ungraded 12 fps playback</title><style>body{margin:0;background:#333;color:#f5f5f5;font:16px system-ui;padding:24px}main{max-width:1100px;margin:auto}.views{display:flex;gap:20px;flex-wrap:wrap}canvas{width:384px;height:576px;max-width:100%;object-fit:contain}button,input{font:inherit}button{margin:12px 6px 12px 0}p{max-width:64ch}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}</style><main><p>Ungraded playback · 12 frames · 12 fps · one-second loop</p><div class="views"><canvas width="256" height="384" id="light"></canvas><canvas width="256" height="384" id="dark"></canvas></div><div class="controls"><button id="toggle">Pause</button><button id="prev">Previous</button><button id="next">Next</button><input id="seek" aria-label="Frame" type="range" min="0" max="11" value="0"><output id="status"></output></div><p>Each complete 192×320 PNG is placed using local ground anchor (96,248). The floor outline and root cross are preview overlays. Timing in result.json is authoritative.</p><script>const sources=["../processed/frames/frame-00.png", "../processed/frames/frame-01.png", "../processed/frames/frame-02.png", "../processed/frames/frame-03.png", "../processed/frames/frame-04.png", "../processed/frames/frame-05.png", "../processed/frames/frame-06.png", "../processed/frames/frame-07.png", "../processed/frames/frame-08.png", "../processed/frames/frame-09.png", "../processed/frames/frame-10.png", "../processed/frames/frame-11.png"];const images=sources.map(src=>{const im=new Image();im.src=src;return im});let playing=true,index=0,base=performance.now();const seek=document.getElementById('seek'),status=document.getElementById('status');function draw(){for(const dark of [false,true]){const c=document.getElementById(dark?'dark':'light'),ctx=c.getContext('2d');ctx.fillStyle=dark?'#18222e':'#f4f6ef';ctx.fillRect(0,0,256,384);ctx.fillStyle=dark?'#283543':'#dfe5dc';ctx.fillRect(64,200,128,128);ctx.strokeStyle='#6b7f70';ctx.strokeRect(64.5,200.5,127,127);ctx.drawImage(images[index],32,16);ctx.strokeStyle='#b72e74';ctx.beginPath();ctx.moveTo(120,264.5);ctx.lineTo(136,264.5);ctx.moveTo(128.5,256);ctx.lineTo(128.5,272);ctx.stroke()}seek.value=index;status.value=`Frame ${index+1} / 12`;}function tick(t){if(playing){index=Math.floor((t-base)*12/1000)%12;draw()}requestAnimationFrame(tick)}document.getElementById('toggle').onclick=()=>{playing=!playing;base=performance.now()-index*1000/12;document.getElementById('toggle').textContent=playing?'Pause':'Play'};function step(delta){playing=false;document.getElementById('toggle').textContent='Play';index=(index+delta+12)%12;draw()}document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);seek.oninput=()=>{index=Number(seek.value);step(0)};Promise.all(images.map(i=>i.decode())).then(()=>{base=performance.now();draw();requestAnimationFrame(tick)});</script></main></html>
